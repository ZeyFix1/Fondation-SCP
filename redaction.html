<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SCPOS — Rédaction</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="scp-theme">
  <header>
    <div class="os-bar">
      <h1>SCPOS v4.08 — ÉDITEUR SÉCURISÉ</h1>
      <div id="authStatus"></div>
    </div>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="scps.html">Base SCP</a>
      <a href="departements.html">Départements</a>
      <a href="mtf.html">FIM / MTF</a>
      <a href="rapport.html">Base Rapports</a>
      <a href="redaction.html" class="active">Rédaction</a>
      <a href="console.html">>_ TERMINAL</a>
    </nav>
  </header>

  <main>
    <h2>SOUMISSION DE RAPPORT</h2>
    
    <form id="scpReportForm">
      <div class="form-group">
        <label for="category">Catégorie :</label>
        <select id="category" required>
          <option value="Scientifique">Scientifique</option>
          <option value="Securite">Sécurité</option>
          <option value="Administratif">Administratif</option>
          <option value="FIM">FIM</option>
        </select>
      </div>

      <div class="form-group">
        <label for="author">Auteur / Matricule :</label>
        <input type="text" id="author" placeholder="ex: Dr. Zeyfix / Agent #4082" required>
      </div>

      <div class="form-group">
        <label for="reportTitle">Titre du rapport :</label>
        <input type="text" id="reportTitle" placeholder="ex: Incident SCP-173-B" required>
      </div>

      <div class="form-group">
        <label for="reportDate">Date :</label>
        <input type="date" id="reportDate" required>
      </div>

      <div class="form-group">
        <label for="content">Contenu du rapport :</label>
        <textarea id="content" rows="8" placeholder="Saisissez le texte..." required></textarea>
      </div>

      <div class="form-group">
        <label for="attachment">Lien pièce jointe (URL) :</label>
        <input type="url" id="attachment" placeholder="https://...">
      </div>

      <div class="form-group">
        <label for="extraInfo">Notes complémentaires :</label>
        <textarea id="extraInfo" rows="3" placeholder="Informations additionnelles..."></textarea>
      </div>

      <div class="button-group">
        <button type="button" id="saveDraftBtn" onclick="saveDraft()">💾 Enregistrer Brouillon</button>
        <button type="submit" id="submitBtn">📤 Envoyer au Réseau</button>
      </div>
    </form>
  </main>

  <div class="taskbar">
    <div class="taskbar-left">
      <span class="start-btn">SCPOS</span>
      <span>Éditeur de texte v2.4</span>
    </div>
    <div class="taskbar-right" id="clock">12:00</div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>

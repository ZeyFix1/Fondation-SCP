<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Fondation SCP - Rédaction de Rapport</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="scp-theme">
  <header>
    <h1>FONDATION SCP - RÉDACTION INTERNE</h1>
    <div id="authStatus"></div>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="scps.html">Base SCP</a>
      <a href="departements.html">Départements</a>
      <a href="mtf.html">FIM / MTF</a>
      <a href="rapport.html">Base Rapports</a>
      <a href="redaction.html" class="active">Rédaction</a>
      <a href="console.html">>_ TERMINAL</a>
    </nav>
  </header>

  <main>
    <h2>[CLASSIFIÉ] SOUMISSION DE NOUVEAU RAPPORT</h2>
    
    <form id="scpReportForm">
      <div class="form-group">
        <label for="category">Catégorie du rapport :</label>
        <select id="category" required>
          <option value="Scientifique">Scientifique</option>
          <option value="Securite">Sécurité</option>
          <option value="Administratif">Administratif</option>
          <option value="FIM">FIM (Force d'Intervention Mobile)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="author">Nom / Prénom ou Matricule :</label>
        <input type="text" id="author" placeholder="ex: Dr. Zeyfix / Agent #4082" required>
      </div>

      <div class="form-group">
        <label for="reportTitle">Nom / Type du rapport :</label>
        <input type="text" id="reportTitle" placeholder="ex: Rapport d'incident SCP-173-B" required>
      </div>

      <div class="form-group">
        <label for="reportDate">Date :</label>
        <input type="date" id="reportDate" required>
      </div>

      <div class="form-group">
        <label for="content">Contenu du rapport :</label>
        <textarea id="content" rows="10" placeholder="Insérer le texte du rapport..." required></textarea>
      </div>

      <div class="form-group">
        <label for="attachment">Pièce jointe (URL d'image - facultatif) :</label>
        <input type="url" id="attachment" placeholder="https://...">
      </div>

      <div class="form-group">
        <label for="extraInfo">Informations supplémentaires / Censure :</label>
        <textarea id="extraInfo" rows="4" placeholder="Notes de sécurité..."></textarea>
      </div>

      <div class="button-group">
        <button type="button" id="saveDraftBtn" onclick="saveDraft()">💾 Sauvegarder en brouillon</button>
        <button type="submit" id="submitBtn">📤 Envoyer le rapport</button>
      </div>
    </form>
  </main>

  <footer>
    <p>&copy; Fondation SCP — Formulaire de soumission officiel.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>

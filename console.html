<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SCPOS — Terminal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="scp-theme console-mode">
  <header>
    <div class="os-bar">
      <h1>SCPOS v4.08 — TERMINAL</h1>
      <div id="authStatus"></div>
    </div>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="scps.html">Base SCP</a>
      <a href="departements.html">Départements</a>
      <a href="mtf.html">FIM / MTF</a>
      <a href="rapport.html">Base Rapports</a>
      <a href="redaction.html">Rédaction</a>
      <a href="console.html" class="active">>_ TERMINAL</a>
    </nav>
  </header>

  <main class="console-container">
    <div id="terminalOutput">
      <p>[SYSTEM INITIALIZED...]</p>
      <p>Connexion établie au serveur central SCPOS.</p>
      <p>Entrez <span style="color:#00ff66;">help</span> pour afficher les commandes disponibles.</p>
    </div>
    
    <div class="command-line">
      <span class="prompt">SCPOS@SITE-19:~#</span>
      <input type="text" id="cliInput" autofocus placeholder="Commande..." autocomplete="off">
    </div>
  </main>

  <div class="taskbar">
    <div class="taskbar-left">
      <span class="start-btn">SCPOS</span>
      <span>Console Système Active</span>
    </div>
    <div class="taskbar-right" id="clock">12:00</div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
